# Public, single-instance hackathon demo.
services:
  - type: web
    name: swarmscope-api
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VALIRON_API_KEY
        sync: false
      - key: ENABLE_RESEARCH
        value: "false"
